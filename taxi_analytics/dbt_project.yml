name: 'taxi_analytics'
version: '1.0.0'
config-version: 2

profile: 'taxi_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  taxi_analytics:
    +schema: staging

models:
  taxi_analytics:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts

vars:
  # Glob for the raw NYC TLC parquet files, relative to the dbt project dir.
  raw_tripdata_glob: '../data/raw/yellow_tripdata_*.parquet'
